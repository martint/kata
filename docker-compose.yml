# Production-ready compose template and local-dev convenience. Either
# pull the published image (`docker compose pull && docker compose up`)
# or build from the working copy (`docker compose up --build`) — the
# `image:` and `build:` lines below cover both flows from one file.
#
# Defaults are tuned for local development with agents:
#   - the host port binds to 127.0.0.1 (only this machine reaches kata)
#   - the binary's default auth mode (trust-client) honours
#     X-Review-Author / ?as= so Claude Code via MCP works out of the
#     box on the same host
#
# For a deployment beyond a single user, set KATA_LISTEN_ADDR=0.0.0.0
# **and** a real KATA_AUTH_MODE in .env (plus TLS / OIDC params as
# needed). See docs/deploying.md for the full menu.
#
# Required env: KATA_WORKSPACES_DIR (host dir of jj repos to serve).
# All other knobs are optional — see .env.example.
#
#   docker compose up                          # production-style serve
#   docker compose up --build                  # rebuild from working copy
#   docker compose --profile demo up           # zero-config guided tour
#   docker compose --profile demo up --build   # demo on local sources

services:
  kata:
    image: ${KATA_IMAGE:-ghcr.io/martint/kata:latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Bare token = the named volume below; a path = bind mount.
      # Unset → managed `kata-data` volume (production default). Set
      # KATA_DATA_DIR=${HOME}/kata to keep state on the host filesystem.
      - "${KATA_DATA_DIR:-kata-data}:/data"
      - "${KATA_WORKSPACES_DIR:?set KATA_WORKSPACES_DIR to a host dir of jj repos}:/workspaces:rw"
    command: ["serve", "--workspace", "*=/workspaces"]
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      traefik:      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kata.rule=Host(`kata.home.weakref.org`)"
      - "traefik.http.routers.kata.entrypoints=websecure"
      - "traefik.http.routers.kata.tls=true"
      - "traefik.http.routers.kata.tls.certresolver=cloudflare"
      - "traefik.http.services.kata.loadbalancer.server.port=7878"      
      - "traefik.http.routers.kata.middlewares=authelia@docker"

  # `docker compose --profile demo up` — seeded workspace + ?demo=1
  # guided tour at http://localhost:7878. No host repo dir needed.
  kata-demo:
    profiles: [demo]
    image: ${KATA_IMAGE:-ghcr.io/martint/kata:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${KATA_LISTEN_ADDR:-127.0.0.1}:${KATA_PORT:-7878}:7878"
    volumes:
      - kata-demo-data:/data
    command: ["demo"]

volumes:
  kata-data:
  kata-demo-data:

networks:
  traefik:
    external: true
