name: release

# Publishes multi-arch (linux/amd64 + linux/arm64) container images
# to GHCR. Pure orchestration: every step about how the image is
# built lives in the Dockerfile (frontend bundle → rustxc cross-
# compile → debian-slim runtime). This workflow just brings up
# buildx, logs in, hands buildx the Dockerfile, and pushes the
# resulting manifest list.
#
# Tag push (v*.*.*) → versioned + :latest.
# Manual dispatch  → :sha-XXXXXXX, so an ad-hoc run can't shadow a
#                    real release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/kata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU registers binfmt_misc handlers so the runtime stage can
      # apt-install ca-certificates on the arm64 leg. The expensive
      # cargo build runs on $BUILDPLATFORM via rustxc, so QEMU is
      # only exercised for the final apt + COPY.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/kata"
          IMAGE="${IMAGE,,}"   # GHCR requires lowercase
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            SHA="${GITHUB_SHA:0:7}"
            echo "tags=${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
